name: Lean

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and check proofs
        run: lake build

      - name: Oracle traces (the E2E vectors through napplet-oracle, byte for byte)
        run: |
          .lake/build/bin/napplet-tracegen traces
          git diff --exit-code -- traces
          ./scripts/check_traces.sh

      - name: Verify the signed Relay fixture against the BIP-340 reference
        run: |
          verifier="$RUNNER_TEMP/bip340-reference.py"
          curl -fsSL --retry 3 -o "$verifier" https://raw.githubusercontent.com/bitcoin/bips/fdcd8024595bc1e97db73883e716dbb91627c371/bip-0340/reference.py
          echo "4b1d4ad9e60820df4a6d239733d52b014bc03e4c47afd757a2fe4d3b586d892c  $verifier" | sha256sum --check
          python3 scripts/check_signed_relay.py "$verifier" traces/relay-query-signed.in.ndjson

      - name: Binding API table matches the documented tables
        run: python3 scripts/binding_api_table.py --check

      - name: No sorry
        run: |
          if grep -rnw sorry Napplet Napplet.lean OracleMain.lean TraceGen.lean; then
            echo "::error::sorry found"; exit 1
          fi

      - name: Axiom audit
        run: |
          lake env lean Audit.lean | tee axioms.txt
          if grep -v "depends on axioms: \[propext\(, Classical.choice\)\?\(, Quot.sound\)\?\]\|does not depend on any axioms" axioms.txt; then
            echo "::error::non-standard axiom found"; exit 1
          fi
